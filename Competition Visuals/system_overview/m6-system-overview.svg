<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="780" viewBox="0 0 1540 780" role="img" aria-labelledby="title desc">
<title id="title">M6 research system overview</title>
<desc id="desc">Historical Yahoo Finance and EODHD market data are prepared for zero-shot time-series foundation models and benchmarks. Foundation-model return scenarios are ranked to estimate quintile probabilities; benchmarks produce probabilities directly. Ranked Probability Score evaluates the forecasts against official M6 outcomes over twelve rounds. Retrospective diagnostics motivate sampling and LoRA interventions, which are assessed through the same M6 evaluation.</desc>
